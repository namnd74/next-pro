<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Glowing Shadow Multi-layer Filters -->
    <filter id="devpro-glow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <!-- Layer 1: Deep ambient soft colored blur (Indigo / Cyan ambient light) -->
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#06B6D4" flood-opacity="0.45" />
      <!-- Layer 2: Mid-range bright neon aura -->
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.55" />
      <!-- Layer 3: Close intense rim highlight -->
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.8" />
    </filter>

    <!-- Main Gradient: Electric Indigo -> Cyber Cyan -> Bright Mint -->
    <linearGradient id="main-neon-grad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366F1" />
      <stop offset="50%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Left Bracket Glowing Gradient -->
    <linearGradient id="left-glow-grad" x1="20" y1="40" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" />
      <stop offset="50%" stopColor="#6366F1" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>

    <!-- Right Bracket Glowing Gradient -->
    <linearGradient id="right-glow-grad" x1="90" y1="40" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="60%" stopColor="#2DD4BF" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Frosted Glass Body Gradient -->
    <linearGradient id="glass-fill-grad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" stop-opacity="0.22" />
      <stop offset="50%" stopColor="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stopColor="#10B981" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Centered Logo Group with Full Neon Glowing Drop Shadow -->
  <g transform="translate(10, 10)" filter="url(#devpro-glow-shadow)">
    <!-- Left Chevron Bracket < (Thick translucent body + luminous neon rim) -->
    <path
      d="M 46 36 L 20 60 L 46 84 L 46 72 L 28 60 L 46 48 Z"
      fill="url(#glass-fill-grad)"
      stroke="url(#left-glow-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Central Lightning Bolt ⚡ (High-voltage Neon Core + Frosted Body) -->
    <path
      d="M 68 18 L 44 56 L 58 56 L 52 102 L 76 52 L 62 52 Z"
      fill="url(#glass-fill-grad)"
      stroke="url(#main-neon-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Right Chevron Bracket > (Thick translucent body + luminous neon rim) -->
    <path
      d="M 74 36 L 100 60 L 74 84 L 74 72 L 92 60 L 74 48 Z"
      fill="url(#glass-fill-grad)"
      stroke="url(#right-glow-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Luminous Core Spark Nodes -->
    <circle cx="68" cy="18" r="2.5" fill="#38BDF8" />
    <circle cx="52" cy="102" r="2" fill="#10B981" />
  </g>
</svg>
