<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Deep Ambient Glow & Shadow Filter -->
    <filter id="icon-glow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#6366F1" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38BDF8" flood-opacity="0.75" />
    </filter>

    <!-- Outer Squircle Rim Gradient -->
    <linearGradient id="squircle-rim" x1="10" y1="10" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6366F1" stop-opacity="0.4" />
      <stop offset="50%" stopColor="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stopColor="#10B981" stop-opacity="0.3" />
    </linearGradient>

    <!-- Main Gradient -->
    <linearGradient id="neon-grad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" />
      <stop offset="50%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Frosted Glass Gradient -->
    <linearGradient id="frost-body" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8" stop-opacity="0.2" />
      <stop offset="50%" stopColor="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stopColor="#10B981" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Matte Dark Squircle -->
  <rect x="8" y="8" width="124" height="124" rx="32" fill="#0A0E1A" stroke="#1E293B" stroke-width="1.5" />
  <rect x="10" y="10" width="120" height="120" rx="30" fill="none" stroke="url(#squircle-rim)" stroke-width="1.2" />

  <!-- Glyphs with Glowing Shadow -->
  <g transform="translate(10, 10)" filter="url(#icon-glow-shadow)">
    <!-- Left Chevron < -->
    <path
      d="M 46 36 L 20 60 L 46 84 L 46 72 L 28 60 L 46 48 Z"
      fill="url(#frost-body)"
      stroke="url(#neon-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Central Bolt ⚡ -->
    <path
      d="M 68 18 L 44 56 L 58 56 L 52 102 L 76 52 L 62 52 Z"
      fill="url(#frost-body)"
      stroke="url(#neon-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Right Chevron > -->
    <path
      d="M 74 36 L 100 60 L 74 84 L 74 72 L 92 60 L 74 48 Z"
      fill="url(#frost-body)"
      stroke="url(#neon-grad)"
      stroke-width="2.5"
      stroke-linejoin="round"
    />

    <!-- Highlight nodes -->
    <circle cx="68" cy="18" r="2.5" fill="#38BDF8" />
    <circle cx="52" cy="102" r="2" fill="#10B981" />
  </g>
</svg>
